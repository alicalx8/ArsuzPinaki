<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İskambil Oyunu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding-top: 90px !important;">
    <!-- Navbar -->
    <nav style="
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        height: 70px !important;
        background: linear-gradient(135deg, #0a1f3a 0%, #051428 50%, #0a1f3a 100%) !important;
        border-bottom: 3px solid #ffd700 !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 0 20px !important;
        z-index: 1000 !important;
        color: white !important;
    ">
        <div style="display: flex; align-items: center;">
            <button id="dealBtn" style="
                background: linear-gradient(145deg, #ffd700, #ffed4e) !important;
                color: #222 !important;
                border: none !important;
                padding: 12px 24px !important;
                border-radius: 25px !important;
                font-size: 16px !important;
                font-weight: bold !important;
                cursor: pointer !important;
                box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3) !important;
                text-transform: uppercase !important;
                letter-spacing: 0.5px !important;
            ">🃏 Kartları Dağıt</button>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; flex: 1;">
            <h1 style="
                color: #ffd700 !important;
                font-size: 32px !important;
                font-weight: bold !important;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5) !important;
                margin: 0 !important;
                letter-spacing: 2px !important;
                text-transform: uppercase !important;
            ">🎮 ONLİNE PİNAKİ 🎮</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="position: relative;">
                <button id="bot-menu-toggle" style="
                    background: linear-gradient(145deg, #3d8bfd, #2563eb) !important;
                    color: white !important;
                    border: none !important;
                    padding: 12px 20px !important;
                    border-radius: 25px !important;
                    font-size: 16px !important;
                    font-weight: bold !important;
                    cursor: pointer !important;
                    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3) !important;
                    text-transform: uppercase !important;
                    letter-spacing: 0.5px !important;
                ">🤖 Botlar</button>
                <div id="bot-menu" style="
                    display: none;
                    position: absolute;
                    top: 52px;
                    right: 0;
                    background: rgba(9, 20, 36, 0.96);
                    border: 1px solid #ffd700;
                    border-radius: 12px;
                    padding: 10px;
                    min-width: 220px;
                    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
                    z-index: 1100;
                ">
                    <div class="bot-menu-item" style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 6px; color:#fff; font-size:14px;">
                        <span>Oyuncu 1</span>
                        <input type="checkbox" data-bot-seat="0" />
                    </div>
                    <div class="bot-menu-item" style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 6px; color:#fff; font-size:14px;">
                        <span>Oyuncu 2</span>
                        <input type="checkbox" data-bot-seat="1" />
                    </div>
                    <div class="bot-menu-item" style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 6px; color:#fff; font-size:14px;">
                        <span>Oyuncu 3</span>
                        <input type="checkbox" data-bot-seat="2" />
                    </div>
                    <div class="bot-menu-item" style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 6px; color:#fff; font-size:14px;">
                        <span>Oyuncu 4</span>
                        <input type="checkbox" data-bot-seat="3" />
                    </div>
                    <div style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.1); padding-top:8px; text-align:center;">
                        <button id="bot-menu-close" style="padding:8px 12px; border:none; border-radius:8px; background:#ffd700; color:#222; font-weight:bold; cursor:pointer;">Kapat</button>
                    </div>
                </div>
            </div>
            <button id="how-to-play-btn" style="
                background: linear-gradient(145deg, #4CAF50, #45a049) !important;
                color: white !important;
                border: none !important;
                padding: 12px 24px !important;
                border-radius: 25px !important;
                font-size: 16px !important;
                font-weight: bold !important;
                cursor: pointer !important;
                box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3) !important;
                text-transform: uppercase !important;
                letter-spacing: 0.5px !important;
            ">📖 Nasıl Oynanır</button>
        </div>
    </nav>

    <div id="left-panel">
        <!-- Kartları Dağıt butonu navbar'a taşındı -->
        <div id="auction" style="margin: 30px 0;">
            <h2>İhale Süreci</h2>
            <div id="auction-status">Kartlar dağıtıldıktan sonra ihale başlayacak.</div>
            <div id="auction-controls" style="display:none;">
                <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start;">
                    <span id="auction-player"></span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="number" id="bid-input" min="0" placeholder="Teklif (sayı)" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px;">
                    </div>
                    <div style="display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap;">
                        <button id="bid-btn" style="padding: 8px 16px; border-radius: 6px; border: none; background: #4CAF50; color: white; font-weight: bold; cursor: pointer;">Teklif Ver</button>
                        <button id="pass-btn" style="padding: 8px 16px; border-radius: 6px; border: none; background: #f44336; color: white; font-weight: bold; cursor: pointer;">Pas</button>
                        <button id="sordum-btn" style="display:none; padding: 8px 16px; border-radius: 6px; border: none; background: #ff9800; color: white; font-weight: bold; cursor: pointer;">Sordum</button>
                        <button id="konus-btn" style="display:none; padding: 8px 16px; border-radius: 6px; border: none; background: #2196F3; color: white; font-weight: bold; cursor: pointer;">Konuş</button>
                        <button id="boz-btn" style="display:none; padding: 8px 16px; border-radius: 6px; border: none; background: #9c27b0; color: white; font-weight: bold; cursor: pointer;">Boz</button>
                    </div>
                </div>
            </div>
            <div id="auction-highest-bid" style="margin-top:8px;font-weight:bold;"></div>
        </div>
        <div id="trump-select" style="display:none; margin: 30px 0;">
            <h2>Koz Seçimi</h2>
            <div id="trump-player"></div>
            <button class="trump-btn" data-suit="♥">♥ Kupa</button>
            <button class="trump-btn" data-suit="♠">♠ Maça</button>
            <button class="trump-btn" data-suit="♦">♦ Karo</button>
            <button class="trump-btn" data-suit="♣">♣ Sinek</button>
        </div>
    </div>
    <div id="right-panel">
        <div id="endgame-result" style="margin-top:16px;font-size:20px;font-weight:bold;color:#ffd700;"></div>
    </div>
    <div id="players" style="margin: 10px auto !important;">
        <div class="player" id="player1" style="
            position: absolute !important; 
            top: 395px !important; 
            bottom: auto !important; 
            left: 340px !important; 
            background: #174ea6 !important;
            z-index: 2 !important;
        "><h4>Oyuncu 1</h4><div class="cards"></div></div>
        <div class="player" id="player2" style="top: 200px !important;"><h4>Oyuncu 2</h4><div class="cards"></div></div>
        <div class="player" id="player3" style="top: 0px !important;"><h4>Oyuncu 3</h4><div class="cards"></div></div>
        <div class="player" id="player4" style="top: 200px !important;"><h4>Oyuncu 4</h4><div class="cards"></div></div>
        <div id="table-center" style="top: 41.5% !important;"><h3>Masa</h3><div id="center-cards"></div></div>
    </div>
    <script src="script.js"></script>
    <div id="score-table" style="display:none; position:fixed; left:24px; bottom:24px; max-width:320px; min-width:220px; background:rgba(0,0,0,0.8); color:#fff; font-size:18px; border-radius:10px; padding:12px; z-index:1000; text-align:center;"></div>
    <div id="pota-chat" style="position:fixed; right:24px; bottom:24px; width:320px; background:rgba(0,0,0,0.85); color:#fff; border-radius:10px; padding:12px; z-index:1001; font-size:17px; box-shadow:0 2px 12px #0005;">
        <div id="pota-chat-messages" style="max-height:160px; overflow-y:auto; margin-bottom:8px;"></div>
        <div style="display:flex; gap:6px;">
            <input id="pota-chat-input" type="text" maxlength="40" placeholder="Pota mesajı yaz..." style="flex:1; border-radius:6px; border:none; padding:6px; font-size:16px;">
            <button id="pota-chat-send" style="border-radius:6px; border:none; background:#ffd700; color:#222; font-weight:bold; padding:6px 12px; cursor:pointer;">Gönder</button>
        </div>
    </div>
</body>
</html>
